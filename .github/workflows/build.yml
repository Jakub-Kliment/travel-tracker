name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  build:
    needs: verify
    # Packaging is slow, so only produce installers for releases and manual runs.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}

    # The default token is read-only, so attaching files to a release 403s
    # without this.
    permissions:
      contents: write

    strategy:
      # One platform failing must not cancel the other two: a Windows problem
      # should still leave a downloadable Mac build behind.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: package:mac
            artifact: '*.dmg'
            label: macOS
          - os: ubuntu-latest
            script: package:linux
            artifact: '*.AppImage'
            label: Linux
          - os: windows-latest
            script: package:win
            artifact: '*.exe'
            label: Windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Package application
        run: npm run ${{ matrix.script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Travel-Tracker-${{ matrix.label }}
          path: release/${{ matrix.artifact }}
          if-no-files-found: error

      # Each runner attaches only the artifact it actually built. Listing all
      # three globs here fails every runner, since a Linux box has no .dmg and
      # no .exe to match -- which is what left earlier tags with no download
      # behind them. The action creates the release on first use and adds to it
      # afterwards, so the files still accumulate across the three runners.
      #
      # This must not be continue-on-error: a failed upload here means the
      # tag exists with no downloadable app behind it, which is exactly the
      # failure worth being told about. Paired with the single glob above,
      # fail_on_unmatched_files now catches only a genuinely empty package
      # step.
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/${{ matrix.artifact }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
